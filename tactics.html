<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scorched Sky · Field Command</title><style>

</style></head><body><main><header class="topline"><div class="brand"><small>SCORCHED SKY / TACTICAL OPERATIONS</small><h1>FIELD COMMAND</h1></div><nav class="links"><a href="battle.html">Side-view</a><button id="restart" aria-label="Restart tactics battle">Reset</button></nav></header><div class="statusline"><span id="status" role="status" aria-live="polite">DEPLOY YOUR FORCE</span><span id="round">ROUND 1</span></div><div class="board-wrap"><canvas id="board" width="864" height="1152" aria-label="Top-down battlefield: tap tiles to deploy, move or target"></canvas><span class="board-label">DUSTLINE CROSSING / ELIMINATION</span></div><div id="help" class="help">Select a squad, then a blue tile to deploy.</div><section id="cards" aria-label="Friendly squads"><button class="card" data-unit="0"></button><button class="card" data-unit="1"></button><button class="card" data-unit="2"></button></section><section class="orders" aria-label="Unit orders"><button id="move">MOVE</button><button id="attack">ATTACK</button><button id="air">AIR ×1</button><button id="hold">HOLD</button></section><button id="confirm">BEGIN BATTLE</button><div class="summary">One move allowance + one attack per unit · alternate activations · eliminate the enemy</div></main><section id="result" class="veil" hidden><div class="panel"><h2 id="resultTitle"></h2><p id="resultCopy"></p><button id="again">Deploy again</button></div></section><script src="tactics.js?v=portrait-1"></script><script src="tactics-view.js?v=modern-command-4"></script></body></html>
