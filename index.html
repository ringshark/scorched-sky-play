<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scorched Sky</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#302c43;color:#fff1db;font:16px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}.game{position:relative;width:min(100vw,177.7778svh);aspect-ratio:16/9;overflow:hidden;border-radius:12px;box-shadow:0 24px 100px #15182a}canvas{width:100%;height:100%;display:block}header{position:absolute;top:3%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:start;color:#453b4c;pointer-events:none}h1{font-size:clamp(16px,2.5vw,32px);margin:0;letter-spacing:.08em}small,.eyebrow{font-size:clamp(10px,1.05vw,14px);letter-spacing:.06em}.right{text-align:right}#status{font-weight:750;font-size:clamp(12px,1.5vw,20px);margin-top:8px}#round{font-size:clamp(10px,1.1vw,14px);font-weight:750}#score{font-size:clamp(12px,1.5vw,20px);font-weight:850;margin-top:6px}#wind{font-weight:850;font-size:clamp(16px,2.4vw,30px)}.wind-caption{font-size:clamp(9px,1vw,12px);letter-spacing:.1em}.controls{z-index:3;position:absolute;bottom:3%;left:3%;right:3%;display:flex;align-items:center;gap:2%;padding:1.2% 1.7%;border:1px solid #f6d6b560;border-radius:16px;background:linear-gradient(180deg,#494258f5,#332f46fa);box-shadow:0 6px 20px #28344b33}.controls label{flex:1;font-weight:750;font-size:clamp(10px,1.2vw,16px);min-width:0}.controls .weapon-label{flex:1.15}input{width:100%;height:32px;accent-color:#65d5f1;touch-action:pan-x}select{width:100%;height:36px;border:1px solid #ffffff27;border-radius:6px;background:#464b62;color:#fff1db;font:600 clamp(10px,1.2vw,16px) system-ui;padding:0 6px}button{cursor:pointer;border:0;border-radius:10px;padding:14px 20px;font:750 clamp(12px,1.3vw,18px) system-ui;background:#fff0ce;color:#40394b;min-height:44px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #69d6ed;outline-offset:3px}#fire{background:#ff845e;min-width:12%}button:disabled{opacity:.45;cursor:default}input:disabled,select:disabled{opacity:.55}#hint{position:absolute;bottom:18%;width:100%;padding:0 4%;text-align:center;color:#453746;text-shadow:0 1px 3px #fff2d9,0 0 8px #fff2d9;font-size:clamp(10px,1.1vw,14px);pointer-events:none}.overlay{z-index:2;padding-bottom:8%;position:absolute;inset:0;background:#24283c70;display:grid;place-items:center;backdrop-filter:blur(3px)}[hidden]{display:none!important}.panel{width:70%;max-height:85%;padding:3%;border:1px solid #ffe3ad45;border-radius:20px;background:#303449f7;box-shadow:0 18px 70px #30233755;text-align:center}.panel h2{font-size:clamp(18px,2.4vw,32px);margin:0 0 1%}.panel p{font-size:clamp(11px,1.3vw,17px);margin:1% 0 3%;color:#e1d2c6}.panel .eyebrow{color:#80daee;display:block;margin-bottom:2%}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2%;margin-top:2%}.weapon-card{padding:6% 5%;display:flex;flex-direction:column;align-items:center;gap:8px;background:#484d64;color:#fff0d7;border:1px solid #ffffff25}.weapon-card:hover:not(:disabled){background:#5b647c;border-color:#7ed9ec;transform:translateY(-2px)}.weapon-symbol{font-size:clamp(20px,3.5vw,46px);color:#f7be7e;line-height:1}.weapon-card strong{font-size:clamp(12px,1.5vw,20px)}.weapon-card small{font-size:clamp(9px,1.05vw,14px);font-weight:400;letter-spacing:0;line-height:1.35}.weapon-card em{font-style:normal;font-size:clamp(10px,1vw,13px);color:#8edbe9;letter-spacing:.12em}#advance{background:#ffaf79;margin-top:1%}@media(max-height:440px){.controls{bottom:2%;padding:.7% 1.5%;gap:1.5%}button{padding:10px 12px}#hint{display:none}header{top:2%}.panel{width:85%;padding:2%}.panel p{margin:1% 0 2%}.weapon-card{gap:4px;padding:4%}select{height:32px}}
.drive-controls{flex:0 0 13%;font-size:clamp(10px,1.1vw,14px);font-weight:750}.drive-controls>div{display:flex;gap:5px;margin-top:4px}.drive-controls button{touch-action:none;user-select:none;flex:1;padding:8px 4px;min-width:0;min-height:36px;background:#d7b591}.controls{gap:1.3%}.controls label{flex:.9}.controls .weapon-label{flex:1.15}#fire{min-width:9%;padding-left:12px;padding-right:12px}@media(max-height:440px){.drive-controls button{min-height:32px;padding:5px}.controls{left:2%;right:2%}.drive-controls{flex-basis:14%}}
</style></head><body><main class="game" aria-label="Scorched Sky artillery duel"><canvas width="1280" height="720" aria-label="Ground battlefield, destructible buildings and two tanks"></canvas><header><div><h1>SCORCHED SKY</h1><div id="round"></div><div id="status" role="status" aria-live="polite"></div></div><div class="right"><span class="wind-caption">WIND</span> <span id="wind"></span><div id="score"></div></div></header><div id="hint"></div><section class="controls" aria-label="Aiming controls"><div class="drive-controls"><span>DRIVE <span id="driveValue">110</span></span><div><button id="driveLeft" aria-label="Drive left">◀</button><button id="driveRight" aria-label="Drive right">▶</button></div></div><label>ANGLE <span id="angleValue"></span><input id="angle" aria-label="Angle" type="range" min="0" max="180" step="1"></label><label>POWER <span id="powerValue"></span><input id="power" aria-label="Power" type="range" min="0" max="100" step="1"></label><label class="weapon-label">WEAPON<select id="weapon" aria-label="Weapon"></select></label><button id="fire">FIRE ↗</button><button id="restart">Restart</button></section><section id="overlay" class="overlay" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><span class="eyebrow">SCORCHED SKY · TERRAIN IS THE GAME</span><h2 id="panelTitle"></h2><p id="panelCopy"></p><div id="choices" class="choices"></div><button id="advance">Continue</button></div></section></main><script src="game.js"></script></body></html>
